<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>College Result Portal — Final (Best PDF Version)</title>

<!-- html2canvas + jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root { --blue: #004aad; --border-width: 4px; }
  body { font-family:"Segoe UI",Arial,sans-serif; background:#eef3fa; margin:20px; text-align:center; }

  select,input {
    padding:10px; margin:6px; border:1px solid #bbb; border-radius:8px; width:220px;
  }
  button {
    background:var(--blue); color:#fff; padding:10px 20px; border:none;
    border-radius:8px; cursor:pointer; font-weight:600;
  }

  #preview-wrap { display:none; justify-content:center; }

  .marksheet {
    width:760px; background:white; padding:18px; border-radius:8px;
    border:var(--border-width) solid var(--blue); box-shadow:0 6px 18px rgba(0,0,0,0.08); text-align:left;
  }

  .ms-header { text-align:center; }
  .ms-header img { width:90px; display:block; margin:0 auto 6px; }
  .ms-header h2 { margin:6px 0 0; font-size:18px; color:var(--blue); }

  table.ms-table { width:100%; border-collapse:collapse; margin-top:10px; }
  table.ms-table th, table.ms-table td {
    border:1px solid #cdd7ea; padding:8px; font-size:13px;
  }
  table.ms-table th { background:#eaf0fc; }

  #download-btn { margin-top:14px; display:none; }
  .signature { text-align:right; margin-top:20px; font-style:italic; }
</style>
</head>

<body>

<img src="https://sasv.org/images/11.png" style="width:70px;display:block;margin:8px auto;">
<h1 style="color:var(--blue);font-size:20px;margin:5px 0;">Smt. K.K. Shah Arts and Smt. L.B. Gunjariya Commerce College, Thara</h1>
<p style="margin-top:-4px;">Affiliated to Hemchandracharya North Gujarat University</p>

<!-- Controls -->
<select id="course">
  <option value="">Select Course</option>
  <option value="ba">B.A</option>
  <option value="bcom">B.Com</option>
</select>

<select id="sem">
  <option value="">Select Semester</option>
  <option value="2">Sem 2</option>
</select>

<input id="roll" placeholder="Enter Roll Number" />
<button id="check-btn">Check Result</button>

<!-- Preview -->
<div id="preview-wrap">
  <div class="marksheet">

    <div class="ms-header">
      <img src="https://sasv.org/images/11.png">
      <h2>Smt. K.K. Shah Arts and Smt. L.B. Gunjariya Commerce College, Thara</h2>
      <p>Affiliated to Hemchandracharya North Gujarat University</p>
      <h3 id="ms-title" style="margin-top:10px;font-size:15px;color:#222;">
        Student Result
      </h3>
    </div>

    <div id="ms-meta" style="margin-top:10px;"></div>
    <table class="ms-table" id="ms-table"></table>

    <div class="signature">
      (Dr. D. S. Charan)<br>Principal
    </div>

    <button id="download-btn">Download Marksheet (PDF)</button>
  </div>
</div>

<script>
/* JSON CONFIG (Option B) */
const files = {
  ba: { 2: ["ba_sem2_gujarati.json", "ba_sem2_sanskrit.json"] },
  bcom: { 2: ["bcom_sem2.json"] }
};

/* Pass rules */
function subjectSpec(index){
  if(index < 4) return { outOf: 50, pass: 18 };
  return { outOf: 25, pass: 9 };
}

let last = { student:null, course:"", sem:"", subjects:[], totalMax:0, totalObt:0, final:"" };

/* Find student in proper JSON file */
async function findStudent(course, sem, roll){
  const group = files[course]?.[sem] || [];
  for(const f of group){
    try {
      const res = await fetch(f);
      if(!res.ok) continue;
      const data = await res.json();
      const stu = data.find(x => String(x["Roll No"]).trim() === String(roll).trim());
      if(stu) return stu;
    } catch(e){}
  }
  return null;
}

/* MAIN: Check Result */
document.getElementById("check-btn").onclick = async () => {
  const course = document.getElementById("course").value;
  const sem = document.getElementById("sem").value;
  const roll = document.getElementById("roll").value.trim();

  if(!course || !sem || !roll){
    alert("Please select course, semester and roll number");
    return;
  }

  const student = await findStudent(course, sem, roll);
  if(!student){
    document.getElementById("preview-wrap").style.display = "none";
    alert("No record found!");
    return;
  }

  const ignore = ["Roll No","Name","Semester","Total Marks","Result"];
  const subjects = Object.keys(student).filter(s => !ignore.includes(s));

  let totalMax = 0, totalObt = 0, pass = true;
  let rows = [];

  subjects.forEach((sub,i)=>{
    const spec = subjectSpec(i);
    let val = student[sub];
    if(val==="" || val==null) val="AB";
    totalMax += spec.outOf;
    if(val !== "AB") totalObt += Number(val);
    if(val==="AB" || Number(val) < spec.pass) pass=false;

    rows.push({name:sub, outOf:spec.outOf, obtained:val});
  });

  last = {
    student,
    course,
    sem,
    subjects:rows,
    totalMax,
    totalObt,
    final: pass ? "PASS" : "FAIL"
  };

  // Update preview
  document.getElementById("ms-title").textContent =
    `${course.toUpperCase()} Semester–${sem} Internal Examination Result (April 2025)`;

  document.getElementById("ms-meta").innerHTML =
    `<b>${student.Name}</b> (${student["Roll No"]})<br>
     Course: ${course.toUpperCase()} | Semester: ${sem}`;

  let html = `<tr>
      <th>Subject</th><th style="text-align:right">Out of</th><th style="text-align:right">Obtained</th>
    </tr>`;

  rows.forEach(r=>{
    html += `<tr>
      <td>${r.name}</td>
      <td style="text-align:right">${r.outOf}</td>
      <td style="text-align:right">${r.obtained}</td>
    </tr>`;
  });

  html += `<tr><th>Total</th><th style="text-align:right">${totalMax}</th><th style="text-align:right">${totalObt}</th></tr>`;
  html += `<tr><th colspan="2">Final Result</th><th style="text-align:right">${last.final}</th></tr>`;

  document.getElementById("ms-table").innerHTML = html;

  document.getElementById("preview-wrap").style.display = "flex";
  document.getElementById("download-btn").style.display = "inline-block";
};

/* PDF EXACT SAME AS PREVIEW */
async function downloadPDF(){
  const element = document.querySelector(".marksheet");

  const canvas = await html2canvas(element, {
    scale: 3,
    useCORS: true
  });

  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF("p","mm","a4");
  const pdfW = pdf.internal.pageSize.getWidth();
  const pdfH = (canvas.height * pdfW) / canvas.width;

  pdf.addImage(imgData,"PNG",0,0,pdfW,pdfH);

  const fname = (last.student.Name || "Marksheet").replace(/\s+/g,'_') + "_Marksheet.pdf";
  pdf.save(fname);
}

document.getElementById("download-btn").onclick = downloadPDF;
</script>

</body>
</html>
